<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>MOTTAINAI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:720px;margin:auto;padding:20px 16px 40px}.head{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:30px}.sub{color:#6b7280;font-size:13px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000b}.hero{background:#111827;color:white}.muted{color:#cbd5e1}.loss{font-size:30px;font-weight:800}button{border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700}.primary{background:#2563eb;color:white}.ghost{background:#eef2ff;color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}input,select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;margin-top:6px}label{display:block;font-size:13px;color:#4b5563;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center}.item h3{margin:0 0 5px}.item p{margin:3px 0;color:#6b7280;font-size:13px}.date{font-weight:800}.expired{color:#dc2626!important}.soon{color:#d97706!important}.ok{color:#059669!important}.hidden{display:none}.empty{text-align:center;color:#6b7280;padding:20px}.small{font-size:12px;color:#6b7280;line-height:1.5;margin-top:10px}</style></head><body><div class="wrap"><div class="head"><div><h1>♻️ MOTTAINAI</h1><div class="sub">期限切れ・使い忘れを減らそう</div></div><button class="ghost" onclick="document.getElementById('photo').click()">＋ 追加</button></div><div class="card hero"><div class="muted">今月失う可能性</div><div class="loss" id="loss">¥0</div><div class="muted">登録した期限付きアイテムの合計</div></div><div id="form" class="card hidden"><h2>期限を登録</h2><label>タイトル<input id="title" placeholder="例：楽天ポイント / 映画チケット"></label><div class="row"><label>種類<select id="type"><option>ポイント</option><option>クーポン</option><option>チケット</option><option>予約</option><option>商品</option><option>その他</option></select></label><label>金額<input id="amount" type="number" min="0" placeholder="0"></label></div><label>期限<input id="date" type="date"></label><label>やること<input id="action" placeholder="例：コンビニで使う"></label><div class="row"><button class="primary" onclick="saveItem()">保存する</button><button class="danger" onclick="cancelForm()">キャンセル</button></div><div class="small">この試作版では画像の内容をAIが自動判定する機能はまだ入っていません。入力した情報はこのiPhoneのブラウザ内に保存されます。</div></div><input id="photo" type="file" accept="image/*" class="hidden" onchange="startItem(this)"><div id="list"></div></div><script>const K='mottainai_items_v1';let items=JSON.parse(localStorage.getItem(K)||'[]');const $=id=>document.getElementById(id);function startItem(e){if(e.files[0])$('form').classList.remove('hidden')}function saveItem(){if(!$('date').value){alert('期限を入力してね');return}items.push({id:Date.now(),title:$('title').value.trim()||'未登録',type:$('type').value,amount:Number($('amount').value||0),date:$('date').value,action:$('action').value.trim()});localStorage.setItem(K,JSON.stringify(items));cancelForm();render()}function cancelForm(){$('form').classList.add('hidden');$('photo').value=''}function del(id){items=items.filter(x=>x.id!==id);localStorage.setItem(K,JSON.stringify(items));render()}function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function render(){items.sort((a,b)=>a.date.localeCompare(b.date));let now=new Date(),mo=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');$('loss').textContent='¥'+items.filter(x=>x.date.startsWith(mo)).reduce((s,x)=>s+x.amount,0).toLocaleString();$('list').innerHTML=items.length?items.map(x=>{let d=Math.ceil((new Date(x.date+'T23:59:59')-new Date())/86400000),c=d<0?'expired':d<=7?'soon':'ok',lab=d<0?'期限切れ':d===0?'今日':d===1?'明日':'あと'+d+'日';return '<div class="card item"><div><h3>'+esc(x.title)+'</h3><p>'+esc(x.type)+(x.amount?'・¥'+x.amount.toLocaleString():'')+'</p><p class="date '+c+'">'+x.date+'　'+lab+'</p>'+(x.action?'<p>→ '+esc(x.action)+'</p>':'')+'</div><button class="danger" onclick="del('+x.id+')">削除</button></div>'}).join(''):'<div class="card empty">まだ登録されていません。<br>右上の「＋追加」から登録してみよう。</div>'}render();</script></body></html>
