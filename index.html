<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOTTAINAI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#f5f7fb;
  color:#111827
}
.wrap{
  max-width:720px;
  margin:auto;
  padding:20px 16px 50px
}
.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}
h1{margin:0;font-size:28px}
.sub{color:#6b7280;font-size:13px}

.card{
  background:white;
  border-radius:20px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 4px 18px #0000000b
}

.hero{
  background:#111827;
  color:white
}
.muted{color:#cbd5e1}
.loss{
  font-size:30px;
  font-weight:800
}

button{
  border:0;
  border-radius:14px;
  padding:12px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer
}
.primary{background:#2563eb;color:white}
.ghost{background:#eef2ff;color:#1d4ed8}
.danger{background:#fee2e2;color:#b91c1c}
.gray{background:#e5e7eb;color:#374151}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:12px;
  font-size:16px;
  margin-top:6px;
  background:white
}

label{
  display:block;
  font-size:13px;
  color:#4b5563;
  margin:12px 0
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center
}

.item h3{
  margin:0 0 5px;
  font-size:18px
}

.item p{
  margin:3px 0;
  color:#6b7280;
  font-size:13px
}

.item-actions{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:70px
}

.item-actions button{
  padding:8px 12px;
  font-size:13px
}

.date{
  font-weight:800
}

.expired{color:#dc2626!important}
.soon{color:#d97706!important}
.ok{color:#059669!important}

.hidden{display:none}

.empty{
  text-align:center;
  color:#6b7280;
  padding:25px
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:10
}

.modalbox{
  width:100%;
  max-width:720px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:24px 24px 0 0;
  padding:20px
}

.modal h2{
  margin-top:0
}

.top-actions{
  display:flex;
  gap:8px;
  margin-top:16px
}

.top-actions button{
  flex:1
}

.sort{
  display:flex;
  gap:8px;
  margin-top:10px
}

.sort button{
  flex:1;
  padding:10px
}
</style>
</head>

<body>

<div class="wrap">

  <div class="head">
    <div>
      <h1>♻️ MOTTAINAI</h1>
      <div class="sub">期限切れ・使い忘れを減らそう</div>
    </div>

    <button class="ghost" onclick="openAddModal()">＋ 追加</button>
  </div>

  <div class="card hero">
    <div class="muted">今月失う可能性</div>
    <div class="loss" id="loss">¥0</div>
    <div class="muted">登録した期限付きアイテムの合計</div>
  </div>

  <div class="card">
    <input
      id="search"
      placeholder="🔎 キーワードで検索"
      oninput="render()"
    >

    <div class="sort">
      <button class="gray" onclick="sortMode='date';render()">期限順</button>
      <button class="gray" onclick="sortMode='amount';render()">金額順</button>
    </div>
  </div>

  <div id="list"></div>

</div>

<!-- 編集用ID -->
<input id="saveEditMode" type="hidden">

<div id="modal" class="modal hidden">
  <div class="modalbox">

    <h2 id="modalTitle">📋 アイテムの登録</h2>

    <label>
      タイトル
      <input id="title" placeholder="例：楽天ポイント">
    </label>

    <div class="row">

      <label>
        種類
        <select id="type">
          <option>ポイント</option>
          <option>クーポン</option>
          <option>チケット</option>
          <option>予約</option>
          <option>商品</option>
          <option>その他</option>
        </select>
      </label>

      <label>
        金額
        <input id="amount" type="number" min="0" placeholder="0">
      </label>

    </div>

    <label>
      期限
      <input id="date" type="date">
    </label>

    <label>
      やること
      <input id="action" placeholder="例：コンビニで使う">
    </label>

    <div class="top-actions">
      <button class="primary" onclick="saveItem()">保存する</button>
      <button class="danger" onclick="closeModal()">キャンセル</button>
    </div>

  </div>
</div>

<script>

const KEY = "mottainai_items_v5";

let items = [];
try {
  items = JSON.parse(localStorage.getItem(KEY) || "[]");
} catch(e) {
  items = [];
}

let sortMode = "date";

function $(id) {
  return document.getElementById(id);
}

/* モーダル表示 */
function openAddModal() {
  closeModal();
  $("saveEditMode").value = "";
  $("modalTitle").textContent = "📋 アイテムの登録";
  
  const today = new Date().toISOString().split('T')[0];
  $("date").value = today;
  
  $("modal").classList.remove("hidden");
}

/* 保存 */
function saveItem() {
  const title = $("title").value.trim() || "未登録";
  const date = $("date").value;

  if(!date) {
    alert("期限を入力してください");
    return;
  }

  const editId = Number($("saveEditMode").value);

  if(editId) {
    items = items.map(function(item) {
      if(item.id === editId) {
        return {
          id: item.id,
          title: title,
          type: $("type").value,
          amount: Number($("amount").value || 0),
          date: date,
          action: $("action").value.trim()
        };
      }
      return item;
    });
  } else {
    items.push({
      id: Date.now(),
      title: title,
      type: $("type").value,
      amount: Number($("amount").value || 0),
      date: date,
      action: $("action").value.trim()
    });
  }

  try {
    localStorage.setItem(KEY, JSON.stringify(items));
  } catch(e) {}

  closeModal();
  render();
}

/* 閉じる */
function closeModal() {
  $("modal").classList.add("hidden");
  $("saveEditMode").value = "";
  $("title").value = "";
  $("amount").value = "";
  $("date").value = "";
  $("type").value = "ポイント";
  $("action").value = "";
}

/* 削除 */
function del(id) {
  if(!confirm("この登録を削除しますか？")) return;
  items = items.filter(function(x) { return x.id !== id; });
  try {
    localStorage.setItem(KEY, JSON.stringify(items));
  } catch(e) {}
  render();
}

/* 編集 */
function editItem(id) {
  const x = items.find(function(item) { return item.id === id; });
  if(!x) return;

  $("modalTitle").textContent = "✏️ 登録内容を編集";
  $("modal").classList.remove("hidden");

  $("title").value = x.title;
  $("type").value = x.type;
  $("amount").value = x.amount;
  $("date").value = x.date;
  $("action").value = x.action;
  $("saveEditMode").value = id;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function(m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m];
  });
}

/* 描画 */
function render() {
  const search = $("search").value.trim().toLowerCase();

  let arr = items.filter(function(x) {
    if(!search) return true;
    return (
      x.title.toLowerCase().indexOf(search) !== -1 ||
      x.type.toLowerCase().indexOf(search) !== -1 ||
      x.action.toLowerCase().indexOf(search) !== -1
    );
  });

  if(sortMode === "amount") {
    arr.sort(function(a, b) { return b.amount - a.amount; });
  } else {
    arr.sort(function(a, b) { return a.date.localeCompare(b.date); });
  }

  const now = new Date();
  const mo = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");

  const loss = items
    .filter(function(x) { return x.date.indexOf(mo) === 0; })
    .reduce(function(s, x) { return s + x.amount; }, 0);

  $("loss").textContent = "¥" + loss.toLocaleString();

  if(!arr.length) {
    $("list").innerHTML = '<div class="card empty">まだ登録されていません。<br>右上の「＋追加」ボタンから登録してみましょう。</div>';
    return;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let html = "";
  for(let i = 0; i < arr.length; i++) {
    const x = arr[i];
    const targetDate = new Date(x.date + "T00:00:00");
    const diffTime = targetDate - today;
    const d = Math.round(diffTime / (1000 * 60 * 60 * 24));

    let c = d < 0 ? "expired" : (d <= 7 ? "soon" : "ok");
    let lab = d < 0 ? "期限切れ" : (d === 0 ? "今日" : (d === 1 ? "明日" : "あと" + d + "日"));

    html += '<div class="card item">' +
      '<div>' +
        '<h3>' + esc(x.title) + '</h3>' +
        '<p>' + esc(x.type) + (x.amount ? ' ・¥' + x.amount.toLocaleString() : '') + '</p>' +
        '<p class="date ' + c + '">' + x.date + '　' + lab + '</p>' +
        (x.action ? '<p>→ ' + esc(x.action) + '</p>' : '') +
      '</div>' +
      '<div class="item-actions">' +
        '<button class="gray" onclick="editItem(' + x.id + ')">編集</button>' +
        '<button class="danger" onclick="del(' + x.id + ')">削除</button>' +
      '</div>' +
    '</div>';
  }

  $("list").innerHTML = html;
}

render();

</script>

</body>
</html>
